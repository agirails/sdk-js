[meta]
title = "The factory standard for software"
intro = """
One bar for quality and security for all code we build, no matter who writes it: Claude, Codex, another model or a \
person. A rule lives at the highest level that can enforce it. An existing violation stays in a baseline that may only \
shrink: a rule fails on new and changed lines and on a violation that a deletion created. The entry point for the check is `bin/code-check`. Exit 0 is clean, exit 1 \
means new violations, and exit 2 means the check could not measure; exit 2 is never a pass. A performance budget (P) \
is a report first, and it becomes a gate only when the noise is measured and the budget is written in `standard/repos/<id>.toml`."""

[[level]]
id = 1
name = "Code and architecture"
text = "the bad pattern cannot be written."

[[level]]
id = 2
name = "Static check"
text = "lint, typecheck, `code-check` and CI; the bad pattern cannot be shipped."

[[level]]
id = 3
name = "Skills and rules"
text = "for judgment that a machine cannot check."

[[level]]
id = 4
name = "Human review"
text = "only for what levels 1–3 do not cover yet; each such finding is a candidate for a higher level."

[[rule]]
id = "K1"
title = "One way for the same thing"
text = "New code uses the existing module or API and does not add a parallel one."
level = [1, 2]
enforcer = "architecture per repo; forbidden imports in `standard/repos/<id>.toml`"
langs = ["all"]

[[rule]]
id = "K2"
title = "A comment is only documentation or a directive"
text = "A comment exists only as documentation of a public symbol or module, a directive with a reason, or `EXTERNAL(...)`."
level = [2]
enforcer = "`code-check comments`"
langs = ["py", "ts", "sol", "sh"]
checker = "comments"
detail = """
Allowed on new lines:
- a Python docstring on a public symbol and a module docstring;
- Solidity NatSpec (`///` or `/** */` with `@notice`, `@dev`, `@param`, `@return`, `@custom`) on contracts, functions, \
events and errors;
- JSDoc/TSDoc directly above an exported declaration or a public member of an exported class;
- a `/** … */` header at the top of a TS or Solidity file;
- `SPDX-License-Identifier`, a shebang, the directives from K5 and `factory-allow`.

A constraint from outside (a dependency, platform, vendor, protocol) may stand next to the call only in the form \
`EXTERNAL(<dependency>): <rule> <url>`. Encoding the constraint as a type, assert, test or lint is preferred.

No other comment is allowed in the body of code. If code needs an explanation, change the name, the structure or the test. \
If the background is a decision, it goes into a decision record. When it is not clear whether an exception applies, the comment does not stay. JSDoc on a local \
or private function fails on new lines.

Words that signal a constraint (IMPORTANT, do not remove, ne diraj, pazi) fail with the message \
"encode the constraint (type, assert, test, lint), then delete the comment".

The check reads code with a tokenizer per language, not with a regex per line: the string `"// not a comment"` does not fail. Consecutive `//`, \
`///` and `#` lines are one comment."""

[[rule]]
id = "K3"
title = "No workaround comments and no TODOs"
text = "Not in a doc comment either. Unfinished work goes into an issue."
level = [2]
enforcer = "`code-check comments` (vocabulary below, English and Croatian)"
langs = ["all"]
checker = "comments"
terms = ["for now", "TODO", "FIXME", "XXX", "hack", "kludge", "band-aid", "quick fix", "workaround", "temporary fix", "temporary solution", "temporary hack", "temporary patch", "temporarily disabled", "temporarily skipped", "temporarily hardcoded", "privremeno rješenje", "za sada", "zasad", "zaobilazak"]
detail = """
"temporary" and "temporarily" count only in phrases from the vocabulary. "no workaround", "without workaround" and \
"workaround mode" do not count. The vocabulary can be evaded ("for now" → "currently"), so a sample of new doc comments \
is reviewed weekly; the review reports, but does not decide."""

[[rule]]
id = "K4"
title = "An error is not swallowed"
text = "No empty `except` or `catch`, no `except Exception: pass`, no `.catch(() => {})` and no empty rejection function in `.then(_, () => {})`. A handler that catches every error and only returns a constant value (`.catch(() => null)`, `catch { return null; }`, `except Exception: return None`) also swallows the error."
level = [2]
enforcer = "ruff `BLE001`, `S110`, `SIM105`; eslint `no-empty`, `@typescript-eslint/no-floating-promises`; an AST check for empty callbacks in `code-check`, because `no-empty` exempts function bodies"
langs = ["py", "ts"]
checker = "checks.handlers"

[[rule]]
id = "K5"
title = "A linter suppression only with the rule name and a reason"
text = "`eslint-disable-next-line <rule> -- reason`, `biome-ignore <category>: reason`, `# noqa: CODE`, `@ts-expect-error reason`. `@ts-ignore` and a bare `# type: ignore` are forbidden. Suppressing a correctness rule requires `factory-allow`; suppressing type checking (`@ts-expect-error`, `# type: ignore[code]`, `# pyright: ignore[code]`) counts as correctness. A suppression for a whole file (`@ts-nocheck`, `# mypy: ignore-errors` and other weaker `mypy:` settings, `# pyright: basic` and `report*=false`) is a violation even with a reason."
level = [2]
enforcer = "eslint `@eslint-community/eslint-comments/require-description`, `@typescript-eslint/ban-ts-comment`; ruff `PGH003`, `PGH004`; rule classes in `standard/configs/rule-classes.toml`"
langs = ["py", "ts"]
checker = "comments"

[[rule]]
id = "K6"
title = "Strict types"
text = "TypeScript `strict` and `noUncheckedIndexedAccess`; the Python SDK and services with type hints and mypy."
level = [2]
enforcer = "`tsc --noEmit` with `standard/configs/tsconfig.strict.json`; mypy"
langs = ["ts", "py"]

[[rule]]
id = "K7"
title = "A warning is an error on new lines"
text = "The linter runs with `--max-warnings 0`."
level = [2]
enforcer = "CI and `code-check`"
langs = ["ts", "py"]

[[rule]]
id = "K8"
title = "No dead code"
text = "No unused imports, variables or exports."
level = [2]
enforcer = "ruff `F401`, `F841`; `@typescript-eslint/no-unused-vars` = error; knip for tier A"
langs = ["ts", "py"]

[[rule]]
id = "K9"
title = "No local paths and no internal infrastructure"
text = "Shipped code and docs do not contain absolute paths of user directories, paths into the internal workspace or names of internal repos. The path patterns are in the check, and the internal names are in `standard/configs/internal-names.txt`."
level = [2]
enforcer = "`code-check paths`"
langs = ["all", "md"]
checker = "checks.paths"

[[rule]]
id = "K10"
title = "Dependencies go one way"
text = "No imports inside functions as a workaround for circular dependencies."
level = [1, 2]
enforcer = "ruff `PLC0415`"
langs = ["py"]

[[rule]]
id = "K11"
title = "The formatter is the only source of style"
text = "The formatter in check mode decides style, not review."
level = [2]
enforcer = "`ruff format --check`, `prettier --check` or the repo's formatter, `forge fmt --check`"
langs = ["all"]

[[rule]]
id = "K12"
title = "A change in behavior has a test that fails without it"
text = "The test is written before the change and must fail for the right reason."
level = [3, 2]
enforcer = "skill `prove`; `code-check` warns about a change in `src/` without a change to tests"
langs = ["all"]
checker = "checks.testdelta"

[[rule]]
id = "K13"
title = "A file or function does not grow past the threshold"
text = "800 lines per file, 120 per function. Only growth fails."
level = [2]
enforcer = "`code-check size`"
langs = ["all"]
checker = "checks.size"

[[rule]]
id = "K14"
title = "Module boundaries are written down and enforced through the import graph"
text = "Electron main, preload and renderer are separate; Next.js server code (database, secrets, keys) is never in a client component (`import \"server-only\"`); the public API of an SDK goes only through `index`."
level = [1, 2]
enforcer = "dependency-cruiser (TS), import-linter (Python), boundaries in `standard/repos/<id>.toml`"
langs = ["ts", "py"]

[[rule]]
id = "K15"
title = "Old and parallel paths are deleted"
text = "A deprecated API has a removal date; dead exports and unused files are deleted."
level = [1, 2]
enforcer = "an inventory of paths per repo; knip or vulture; `code-check` fails on `@deprecated` without a date"
langs = ["ts", "py", "sol"]
checker = "comments"

[[rule]]
id = "K16"
title = "A repeated script becomes a CLI"
text = "A script that agents write in two sessions becomes a CLI in the `scripts/` of a skill or repo."
level = [3, 2]
enforcer = "a transcript miner that feeds the skill `correct`"
langs = ["all"]

[[rule]]
id = "K17"
title = "TypeScript without escapes from the type system"
text = "No `as` (except `as const`), `!`, `any` or `console.*` in libraries; `switch` is exhaustive; no `no-unsafe-*` violations."
level = [2]
enforcer = "typescript-eslint `no-explicit-any`, `no-non-null-assertion`, `consistent-type-assertions`, `switch-exhaustiveness-check`, `no-unsafe-*`; eslint `no-console`"
langs = ["ts"]

[[rule]]
id = "K18"
title = "No lists kept in sync by hand"
text = "When the same things live in two places, one is generated from the other, or a test fails when they differ."
level = [1, 2]
enforcer = "`bin/standard gen --check`; `tests/test_standard.py`"
langs = ["all"]

[[rule]]
id = "K19"
title = "Tests are not disabled and not weakened"
text = "An added `.only`, `.skip`, `.fixme`, `.fail`, `xit`, `xfail`, `pytest.skip` or `vm.skip` fails; a removed assertion gives a warning; a new test must fail on a mutation that breaks the behavior."
level = [2, 3]
enforcer = "`code-check tests`; skill `prove`"
langs = ["all"]
checker = "checks.tests_guard"

[[rule]]
id = "S1"
title = "No secrets in the diff or in the history"
text = "A secret does not enter the diff; the history is scanned once, and the report does not contain secret values. The configuration does not take over upstream path allowlists (vendor, node_modules, lockfiles), and a repo `.gitleaksignore` is not honored."
level = [2]
enforcer = "gitleaks (pinned, `standard/configs/gitleaks.toml` generated from its default configuration) over the diff in `code-check` and in CI"
langs = ["all", "md"]
checker = "checks.external"

[[rule]]
id = "S2"
title = "A new dependency is pinned and reviewed"
text = "A lockfile, a pinned version, an audit without high or critical findings, reviewed install scripts."
level = [2, 3]
enforcer = "`code-check deps` on a lockfile change (`npm audit --omit=dev --audit-level=high`, osv-scanner or pip-audit); skill `supply-chain-security` for each new dependency"
langs = ["ts", "py"]

[[rule]]
id = "S3"
title = "GitHub Actions are pinned and minimal"
text = "Actions are pinned to a SHA, `permissions:` is minimal, no `pull_request_target` with a checkout of the PR's code and no `${{ github.event.* }}` in `run:`. A workflow or `action.yml` that cannot be read is not a pass, and shellcheck checks the scripts in `run:`."
level = [2]
enforcer = "zizmor `--strict-collection`, actionlint and shellcheck (pinned, `standard/configs/zizmor.yml`)"
langs = ["gha"]
checker = "checks.external"

[[rule]]
id = "S4"
title = "Solidity without new high or medium findings"
text = "slither without new high or medium findings, NatSpec on external and public functions, CEI."
level = [2, 3]
enforcer = "slither in CI with a baseline; solhint (`standard/configs/.solhint.json`); skill `smart-contract-implementation`"
langs = ["sol"]

[[rule]]
id = "S5"
title = "No dangerous calls"
text = "No `eval`, no `exec` with input, no `shell=True` with a variable, no `child_process.exec` with interpolation, no `pickle` over untrusted input and no SQL concatenated from strings."
level = [2]
enforcer = "ruff `S`; eslint `no-eval`, `no-implied-eval`, `no-new-func`, restricted `child_process.exec`"
langs = ["py", "ts"]

[[rule]]
id = "S6"
title = "A diff at a trust boundary goes through a security review"
text = "Auth, bridges, egress, permissions, money and signatures go through `blast-radius`, `security-audit` guidance and Codex Security `security-diff-scan` before shipping. Contracts and an SDK major version go into a full audit before release."
level = [2, 3]
enforcer = "`code-check` flags a diff that touches `trust_boundary` from `standard/repos/<id>.toml`; `prove` asks for the audit record"
langs = ["all"]

[[rule]]
id = "S7"
title = "Repo code runs only in a sandbox"
text = "A check that runs repo code (linter configuration, tests, a repro of a finding) goes through a sandbox that protects both the network and confidentiality. Known limit: the total memory of all processes and the total writes into the writable paths are not limited, because that would require a cgroup over the user systemd bus; per process, the limits are private memory in the heap and in private mappings (RLIMIT_DATA, default 4 GB), address space (RLIMIT_AS, default 4 GB; the call that code-check runs with gitleaks asks for 8 GB, because the pinned gitleaks reserves about 5.4 GB and uses about 0.15 GB) and CPU time, plus the number of processes, the size of one file, tmpfs and output. RLIMIT_DATA does not count the stack (the main stack, MAP_GROWSDOWN, mremap of the stack) or shared mappings, so address space is the upper memory bound of one process."
level = [1, 2]
enforcer = "`bin/sandbox-run`; tier B uses only our configuration"
langs = ["all"]

[[rule]]
id = "P1"
title = "Solidity contracts"
text = "Gas per function does not grow without a reason."
level = [2]
enforcer = "`forge snapshot --check` in CI; a snapshot change needs a reason in the commit"
langs = ["sol"]

[[rule]]
id = "P2"
title = "SDK packages"
text = "Package size and import time do not grow by more than 5 %."
level = [2]
enforcer = "`npm pack --dry-run`, `require` time, `python -X importtime`"
langs = ["ts", "py"]

[[rule]]
id = "P3"
title = "Web"
text = "LCP < 2.5 s, CLS < 0.1, INP < 200 ms on the mobile profile; JS per route does not grow without a reason."
level = [2]
enforcer = "Lighthouse CI or a verify skill over a preview build"
langs = ["ts"]

[[rule]]
id = "P4"
title = "Desktop application"
text = "No long tasks > 50 ms on the main paths; a frame ≤ 16 ms while scrolling."
level = [2]
enforcer = "a verify skill with a CDP trace"
langs = ["ts"]

[[rule]]
id = "P5"
title = "APIs and services"
text = "p95 per endpoint is recorded and does not grow by more than 20 %."
level = [2]
enforcer = "a verify skill or a benchmark script"
langs = ["all"]
