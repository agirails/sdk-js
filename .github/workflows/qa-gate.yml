name: QA Gate

on:
  workflow_dispatch:
    inputs:
      run_canary_gate:
        description: "Run canary approval + smoke/guard checks"
        required: false
        default: false
        type: boolean
      canary_health_url:
        description: "Canary health URL (JSON expected)"
        required: false
        type: string
      min_payment_success_rate:
        description: "Minimum payment_success_rate (default 0.995)"
        required: false
        default: "0.995"
        type: string
      min_activation_success_rate:
        description: "Minimum activation_success_rate (default 0.99)"
        required: false
        default: "0.99"
        type: string
      max_fallback_to_eoa_rate:
        description: "Maximum fallback_to_eoa_rate (default 0.05)"
        required: false
        default: "0.05"
        type: string
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - ".eslintrc.cjs"
      - "docs/GO-LIVE-QA-GATE.md"
      - ".github/workflows/qa-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - ".eslintrc.cjs"
      - "docs/GO-LIVE-QA-GATE.md"
      - ".github/workflows/qa-gate.yml"

permissions:
  contents: read

jobs:
  gate-docs:
    name: Gate Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify gate document exists
        run: test -f "docs/GO-LIVE-QA-GATE.md"

  sdk-quality:
    name: SDK Quality Gate
    runs-on: ubuntu-latest
    needs: gate-docs
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (no emit)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Full test suite
        run: npm test -- --no-coverage

  qa-summary:
    name: QA Gate Summary
    runs-on: ubuntu-latest
    needs: [gate-docs, sdk-quality]
    if: ${{ success() }}
    steps:
      - name: Write summary
        run: |
          {
            echo "## QA Gate Passed";
            echo "";
            echo "- Gate docs check: passed";
            echo "- SDK quality gate: passed";
            echo "- Required commands: tsc, lint, build, full tests";
          } >> "$GITHUB_STEP_SUMMARY"

  canary-approval:
    name: Canary Approval
    runs-on: ubuntu-latest
    needs: sdk-quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_canary_gate == true }}
    environment: canary-approval
    steps:
      - name: Approval checkpoint
        run: echo "Canary approval granted."

  canary-smoke:
    name: Canary Smoke + Guard
    runs-on: ubuntu-latest
    needs: [sdk-quality, canary-approval]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_canary_gate == true }}
    steps:
      - name: Validate canary URL input
        run: |
          if [ -z "${{ inputs.canary_health_url }}" ]; then
            echo "canary_health_url is required when run_canary_gate=true"
            exit 1
          fi

      - name: Fetch canary health payload
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "${{ inputs.canary_health_url }}" -o canary.json
          cat canary.json

      - name: Evaluate rollout guards
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("canary.json", "utf8"));
            const payment = Number(p.payment_success_rate);
            const activation = Number(p.activation_success_rate);
            const fallback = Number(p.fallback_to_eoa_rate);

            const minPayment = Number(process.env.MIN_PAYMENT);
            const minActivation = Number(process.env.MIN_ACTIVATION);
            const maxFallback = Number(process.env.MAX_FALLBACK);

            if (![payment, activation, fallback].every(Number.isFinite)) {
              console.error("Canary payload must include numeric payment_success_rate, activation_success_rate, fallback_to_eoa_rate");
              process.exit(1);
            }
            if (payment < minPayment) {
              console.error("payment_success_rate below threshold");
              process.exit(1);
            }
            if (activation < minActivation) {
              console.error("activation_success_rate below threshold");
              process.exit(1);
            }
            if (fallback > maxFallback) {
              console.error("fallback_to_eoa_rate above threshold");
              process.exit(1);
            }
          '
        env:
          MIN_PAYMENT: ${{ inputs.min_payment_success_rate }}
          MIN_ACTIVATION: ${{ inputs.min_activation_success_rate }}
          MAX_FALLBACK: ${{ inputs.max_fallback_to_eoa_rate }}

      - name: Canary gate summary
        run: |
          {
            echo "## Canary Gate Passed";
            echo "";
            echo "- URL: ${{ inputs.canary_health_url }}";
            echo "- payment_success_rate >= ${{ inputs.min_payment_success_rate }}";
            echo "- activation_success_rate >= ${{ inputs.min_activation_success_rate }}";
            echo "- fallback_to_eoa_rate <= ${{ inputs.max_fallback_to_eoa_rate }}";
          } >> "$GITHUB_STEP_SUMMARY"
