name: SDK TypeScript CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - '.github/workflows/sdk-ts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - '.github/workflows/sdk-ts-ci.yml'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action v2 requires a separate license for organization
      # repositories. Run the open-source CLI directly so this remains a real
      # merge gate rather than an always-red, continue-on-error warning.
      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_LINUX_X64_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan commits introduced by this event
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Git commit range supplied by the workflow event" >&2
            exit 2
          fi
          if [[ "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner \
            --no-color \
            --redact \
            --verbose \
            --log-opts="--all $BASE_SHA..$HEAD_SHA" \
            .

  lint-build-test:
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build (tsc)
        run: npm run build

      - name: Unit tests
        run: npm test

  cjs-smoke:
    runs-on: ubuntu-latest
    needs: lint-build-test
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: CJS require() smoke test
        run: |
          node -e "
            const sdk = require('./dist/index.js');
            const assert = require('assert');

            // Core exports
            assert(sdk.ACTPClient, 'ACTPClient missing');
            assert(typeof sdk.ACTPClient.create === 'function', 'ACTPClient.create not a function');

            // Error classes
            assert(sdk.ACTPError, 'ACTPError missing');
            assert(sdk.TransactionNotFoundError, 'TransactionNotFoundError missing');
            assert(sdk.InvalidStateTransitionError, 'InvalidStateTransitionError missing');
            assert(sdk.InsufficientBalanceError, 'InsufficientBalanceError missing');
            assert(sdk.ValidationError, 'ValidationError missing');

            // Adapters
            assert(sdk.BasicAdapter, 'BasicAdapter missing');
            assert(sdk.StandardAdapter, 'StandardAdapter missing');

            // Runtime
            assert(sdk.MockRuntime, 'MockRuntime missing');

            // Wallet
            assert(sdk.EOAWalletProvider, 'EOAWalletProvider missing');

            console.log('CJS smoke test passed on Node ' + process.version);
          "

      - name: CJS sub-path export test
        run: |
          node -e "
            const storage = require('./dist/storage/index.js');
            const assert = require('assert');
            assert(storage, 'storage sub-path export missing');
            console.log('CJS sub-path export test passed on Node ' + process.version);
          "

      - name: Verify CJS module format
        run: |
          # The require() smoke test above already proves CJS works.
          # Additionally, verify tsconfig emits commonjs:
          node -e "
            const ts = require('./tsconfig.json');
            const assert = require('assert');
            assert.strictEqual(
              ts.compilerOptions.module.toLowerCase(), 'commonjs',
              'tsconfig.json module must be commonjs, got: ' + ts.compilerOptions.module
            );
            console.log('tsconfig.json module = commonjs — OK');
          "

  # ----------------------------------------------------------------------
  # PRD §8.2 — Anvil-fork blockchain-runtime e2e suite.
  #
  # Spins up real anvil processes against a forked Base Sepolia state to
  # cover the 15 scenarios in src/__e2e__/blockchain-runtime/. The suite
  # requires two repository secrets:
  #   - BASE_SEPOLIA_RPC: paid-tier upstream RPC URL anvil forks against
  #     (Alchemy / Infura — free public RPCs throttle queryFilter scans)
  #   - CI_TEST_KEYSTORE_BASE64: base64 of a BIP-39 mnemonic with small
  #     amounts of Base Sepolia ETH + test USDC on the first few HD slots
  #
  # Gate: pull requests from forks don't have access to repository
  # secrets, so this job runs only on push-to-main or PRs from the same
  # repository. Forks see a single "skipped" entry on the PR check list
  # and the main test matrix above still gates merge.
  # ----------------------------------------------------------------------
  fork-e2e:
    needs: lint-build-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (tsc)
        run: npm run build

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify anvil is on PATH
        run: anvil --version

      - name: Run anvil-fork e2e suite
        env:
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
          CI_TEST_KEYSTORE_BASE64: ${{ secrets.CI_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BASE_SEPOLIA_RPC" ] || [ -z "$CI_TEST_KEYSTORE_BASE64" ]; then
            echo "::warning::Fork-e2e secrets not configured for this run — suite skip-gate will fire and report 0 failures, but no on-chain assertions ran."
          fi
          npm run test:fork-e2e
